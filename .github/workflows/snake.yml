# Place at: .github/workflows/snake.yml in the rwkyyy/rwkyyy repo
name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#873EFF&color_dots=#ebedf0,#d9c8ff,#b48cff,#9a5cff,#873EFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#873EFF&color_dots=#161b22,#2b1f4d,#4a2d8f,#6a3fd1,#873EFF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
